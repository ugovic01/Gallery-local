<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Gallery Management System</h1>

  <div class="controls">
    <input type="file" id="imageInput" accept="image/*" />
    <input type="text" id="imageTitle" placeholder="Image title" />
    <button id="addImageBtn">Add Image</button>
    <button id="clearGalleryBtn">Clear Gallery</button>
  </div>

  <div id="gallery"></div>

  <script src="script.js"></script>
</body>
</html>
